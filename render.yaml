services:
  - type: web
    name: dandoev-dashboard
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_APP_URL
        value: https://dashboard.dandoev.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MONO_CONNECT_SECRET_KEY
        sync: false
      - key: MONO_LOOKUP_SECRET_KEY
        sync: false
      - key: MONO_PROVE_SECRET_KEY
        sync: false
      - key: MONO_PAYMENTS_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_MONO_PUBLIC_KEY
        sync: false
      - key: MONO_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: MONO_LOOKUP_WEBHOOK_SECRET
        sync: false
      - key: MONO_PROVE_WEBHOOK_SECRET
        sync: false
      - key: MONO_PAYMENTS_WEBHOOK_SECRET
        sync: false
